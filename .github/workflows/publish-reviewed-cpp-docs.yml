# One-time delivery of reviewed HTML additions. No workflow is included in the PR.
name: Publish reviewed Unreal C++ references
on:
  push:
    branches: [docs/cpp-api-publication-20261003]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply data-only additions and verify the reviewed documentation tree
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, subprocess
          from pathlib import Path
          base = 'a8549f5f295b410ee050dcd8558b54c5a064649d'
          branch = 'docs/add-unreal-cpp-api-references'
          def git(*args):
              return subprocess.check_output(['git', *args])
          compressed = b''.join(Path('.publication/cpp-part-' + str(i) + '.xz').read_bytes() for i in range(4))
          assert hashlib.sha256(compressed).hexdigest() == '92f9a9a55c97f578b4bf8a745c3540352c721ba04e80b15325b49e119bceb0df'
          payload = json.loads(lzma.decompress(compressed))
          assert not git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch).strip()
          git('checkout', '-b', branch, base)
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == 'e0708c260f3f5886bd0cd02765641199f7562051'
          assert set(payload['new']) == {'unreal-cpp-reference.html', 'sources/unreal-cpp-references.json'}
          root = Path.cwd()
          def target(name):
              p = root / name
              assert root in p.resolve().parents and '.git' not in p.parts
              return p
          for name, edits in payload['edits'].items():
              p = target(name)
              text = p.read_bytes().decode('utf-8')
              assert all(0 <= i <= len(text) for i, _ in edits)
              for i, fragment in sorted(edits, key=lambda e: e[0], reverse=True):
                  text = text[:i] + payload['fragments'][fragment] + text[i:]
              p.write_bytes(text.encode('utf-8'))
          for name, text in payload['new'].items():
              p = target(name)
              assert not p.exists()
              p.write_bytes(text.encode('utf-8'))
          git('add', '--all')
          git('diff', '--cached', '--check')
          assert git('write-tree').decode().strip() == '474abf3bab73e3b4c3f2b46901d8698ed180c9f2'
          assert not Path('.github').exists() and not Path('.publication').exists()
          print(git('diff', '--cached', '--stat').decode())
          PY
      - name: Commit and push the new documentation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: add verified Unreal Engine C++ API references'
          git push origin HEAD:refs/heads/docs/add-unreal-cpp-api-references
          git rev-parse HEAD
